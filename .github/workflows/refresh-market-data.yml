name: Refresh market data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy google-cloud-bigquery db-dtypes

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Fetch live market data
        run: python fetch_market_data.py

      - name: Load into BigQuery
        env:
          GCP_PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
          BQ_DATASET: "${{ secrets.BQ_DATASET }}"
        run: python load_market_data.py
